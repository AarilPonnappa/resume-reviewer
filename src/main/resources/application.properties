spring.application.name=resumeiq

# Read KEY=VALUE pairs from a .env file in the project folder (if there is one).
# Real environment variables (e.g. on a deployment platform) take priority over the .env file.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# ---------------- Gemini ----------------
# Server-wide key. Optional: users can also paste their own key in the app (kept only in their session).
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:180}

# ---------------- Database ----------------
# Default: an H2 database stored in ./data (no setup needed).
# For PostgreSQL set DATABASE_URL=jdbc:postgresql://host:5432/dbname plus DATABASE_USERNAME / DATABASE_PASSWORD.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/resumeiq}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------------- Uploads ----------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# let Tomcat read (and discard) slightly-too-big uploads so the user gets a JSON error instead of a dropped connection
server.tomcat.max-swallow-size=10MB

# ---------------- Sessions ----------------
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---------------- Email verification (off by default) ----------------
app.email-verification.enabled=${EMAIL_VERIFICATION_ENABLED:false}
# used to build the link inside the verification email
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.mail.from=${MAIL_FROM:no-reply@resumeiq.local}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
