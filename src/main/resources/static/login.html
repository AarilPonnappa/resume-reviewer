<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in · ResumeIQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <a href="/" class="d-block text-center text-decoration-none mb-4">
            <span class="h3 fw-bold" style="color: var(--navy)">ResumeIQ</span><span class="brand-dot"></span>
        </a>
        <div class="app-card p-4">
            <h1 class="h4 card-title mb-1">Welcome back</h1>
            <p class="text-secondary mb-4">Log in to review your resume.</p>

            <div id="notice" class="alert alert-success d-none" role="status"></div>

            <form id="loginForm" onsubmit="login(event)" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" autocomplete="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" id="loginBtn" class="btn btn-primary w-100">Log in</button>
            </form>

            <p id="status" class="status-line text-danger small mt-3 mb-0"></p>
        </div>
        <p class="text-center text-secondary mt-3">
            New here? <a href="/register.html">Create an account</a>
        </p>
    </div>
</div>
<script src="/js/login.js"></script>
</body>
</html>
