<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account · ResumeIQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <a href="/" class="d-block text-center text-decoration-none mb-4">
            <span class="h3 fw-bold" style="color: var(--navy)">ResumeIQ</span><span class="brand-dot"></span>
        </a>
        <div class="app-card p-4">
            <h1 class="h4 card-title mb-1">Create your account</h1>
            <p class="text-secondary mb-4">Your reviews are saved so you can track your progress.</p>

            <div id="notice" class="alert alert-success d-none" role="status"></div>

            <form id="registerForm" onsubmit="register(event)" novalidate>
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" id="name" class="form-control" autocomplete="name" maxlength="80" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" autocomplete="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" autocomplete="new-password"
                           minlength="8" maxlength="72" required>
                    <div class="form-text">At least 8 characters.</div>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm password</label>
                    <input type="password" id="confirmPassword" class="form-control" autocomplete="new-password" required>
                </div>
                <button type="submit" id="registerBtn" class="btn btn-primary w-100">Create account</button>
            </form>

            <p id="status" class="status-line text-danger small mt-3 mb-0"></p>
        </div>
        <p class="text-center text-secondary mt-3">
            Already have an account? <a href="/login.html">Log in</a>
        </p>
    </div>
</div>
<script src="/js/register.js"></script>
</body>
</html>
