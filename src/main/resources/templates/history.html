<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>History · ResumeIQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand navbar-dark app-navbar">
    <div class="container">
        <a class="navbar-brand" href="/review">ResumeIQ<span class="brand-dot"></span></a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="/review">Review</a></li>
            <li class="nav-item"><a class="nav-link active" href="/history">History</a></li>
        </ul>
        <span class="navbar-text text-light me-3 d-none d-sm-inline" th:text="${name}">User</span>
        <button class="btn btn-sm btn-outline-light" type="button" onclick="logout()">Log out</button>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 card-title mb-0" style="color: var(--navy); font-weight: 700;">Your reviews</h1>
        <a href="/review" class="btn btn-primary btn-sm">New review</a>
    </div>

    <div class="app-card p-0 overflow-hidden">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th class="ps-4">Date</th>
                    <th>File</th>
                    <th>Target role</th>
                    <th>Score</th>
                    <th class="text-end pe-4">Actions</th>
                </tr>
                </thead>
                <tbody id="historyTable"></tbody>
            </table>
        </div>
        <p id="emptyState" class="text-secondary text-center py-5 mb-0 d-none">
            No reviews yet. <a href="/review">Review your first resume</a>.
        </p>
    </div>
    <p id="status" class="status-line small text-danger mt-3"></p>
</main>

<script src="/js/history.js"></script>
</body>
</html>
